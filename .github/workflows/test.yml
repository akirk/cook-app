name: Tests

on:
  push:
    branches-ignore:
      - 'dist/**'
    tags:
      - '*'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

  workflow_dispatch:
    inputs:
      release-tag:
        description: 'Planned release tag (for example 1.2.0 or v1.2.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref_name || github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  release-version:
    name: Release version guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Check release versions
        env:
          RELEASE_TAG: ${{ inputs.release-tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: php scripts/check-release-version.php

  php:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zip
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPCS
        run: composer lint

      - name: Run tests
        run: composer test
